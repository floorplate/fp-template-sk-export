<div {{partial:anchor_id}}
    class="border-t border-current/10 {{if !background_color_override}}bg-primary-light-color{{/if}} px-om {{partial:text_color}} {{if spacing_top_override}}{{partial:spacing_top_override}}{{else}}pt-fm-8xl{{/if}} {{if spacing_bottom_override}}{{partial:spacing_bottom_override}}{{else}}pb-fm-8xl{{/if}}"
    style="{{if background_color_override}}background-color: {{background_color_override}};{{/if}}">
    <div class="screen-max">
        <div class="flex flex-col gap-fm-8xl">
            {{ if title }}
                <div class="flex justify-center">
                    <h2 class="h2 text-center max-w-[623px] lg:max-w-[623px] xl:max-w-[690px] 2xl:max-w-[717px] 3xl:max-w-[754px]">
                        {{ title }}
                    </h2>
                </div>
            {{ /if }}

            {{ if stats }}
                <div
                    class="flex flex-col md:flex-row md:flex-wrap justify-center gap-8 md:gap-10 lg:gap-12 xl:gap-14 2xl:gap-16 3xl:gap-16">
                    {{ stats }}
                        <div
                            class="flex flex-col items-center text-center gap-3 md:gap-4 lg:gap-4 w-full md:w-auto md:min-w-[200px] md:max-w-[280px] lg:min-w-[220px] lg:max-w-[300px] xl:min-w-[240px] xl:max-w-[320px]">
                            <div class="flex flex-col items-center justify-between">
                                {{ value }}
                                    {{ if type == "text_value" }}
                                        {{ if text }}
                                            <span class="text-[36px] font-black leading-[88%]">{{ text }}</span>
                                        {{ /if }}
                                    {{ elseif type == "icon_value" }}
                                        {{ icon }}
                                            <div class="flex items-center justify-center">
                                                <img src="{{ glide:url fit='crop_focal' w='80' }}" loading="eager"
                                                    decoding="async" alt="{{ alt ?? 'Stat icon' }}" class="h-10" />
                                            </div>
                                        {{ /icon }}
                                    {{ /if }}
                                {{ /value }}
                            </div>

                            {{ if description }}
                                <p class="max-w-[80%] text-balance">
                                    {{ description }}
                                </p>
                            {{ /if }}
                        </div>
                    {{ /stats }}
                </div>
            {{ /if }}
        </div>
    </div>
</div>
