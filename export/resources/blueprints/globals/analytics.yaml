tabs:
  main:
    display: Main
    sections:
      -
        display: 'Fathom Analytics'
        instructions: 'Privacy-friendly page view tracking. Floorplate creates a Fathom site for every site and fills this in.'
        fields:
          -
            handle: fathom_site_id
            field:
              type: text
              display: 'Fathom Site ID'
              instructions: 'The Site ID shown in Fathom under Settings → Sites (e.g. ABCDEFG). Leave empty to turn tracking off.'
              input_type: text
              antlers: false
              validate:
                - nullable
                - 'regex:/^[A-Za-z0-9]+$/'
                - 'max:32'
