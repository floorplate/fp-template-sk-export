tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: section_anchor
            field:
              type: section_anchor
              display: 'Section Anchor'
              instructions: 'Optional. Jump to a section on the linked page instead of its top. Renaming that section’s Anchor ID will not break this link.'
          -
            handle: open_in_new_tab
            field:
              type: toggle
              display: 'Open in a new tab'
              instructions: 'When enabled, the link opens in a new browser tab.'
              default: false
              validate:
                - required
