title: Contact
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              width: 50
              autocomplete: name
              validate:
                - required
                - 'max:255'
          -
            handle: email
            field:
              type: text
              input_type: email
              display: Email
              width: 50
              autocomplete: email
              validate:
                - required
                - email
                - 'max:255'
          -
            handle: company
            field:
              type: text
              display: Company
              autocomplete: organization
              validate:
                - 'max:255'
          -
            handle: message
            field:
              type: textarea
              display: Message
              validate:
                - required
                - 'max:5000'
