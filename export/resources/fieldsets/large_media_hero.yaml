title: 'Large Media Hero'
fields:
  -
    handle: mobile_aspect_video
    field:
      type: toggle
      display: 'Video aspect on mobile'
      instructions: 'When enabled, the hero uses 16:9 (aspect-video) on mobile. When off, mobile uses a taller portrait ratio and desktop stays 16:9.'
      default: false
      validate:
        - required
  -
    handle: media_type
    field:
      max_sets: 1
      type: replicator
      display: 'Media Type'
      validate:
        - required
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            image:
              display: Image
              icon: media-image-picture-orientation
              fields:
                -
                  handle: hero_image
                  field:
                    container: assets
                    type: assets
                    display: 'Hero Image'
                    validate:
                      - required
                    max_files: 1
                    min_files: 1
            vimeo_video_embed:
              display: 'Vimeo Video Embed'
              icon: media-webcam-video
              fields:
                -
                  handle: vimeo_embed_link
                  field:
                    type: link
                    display: 'Vimeo Embed Link'
                    validate:
                      - required
  -
    import: anchor_id
