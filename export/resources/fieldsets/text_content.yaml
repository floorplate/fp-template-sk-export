title: 'Text Content'
fields:
  -
    handle: text_content
    field:
      buttons:
        - highlight
        - secondary
        - bts_attributes
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - bold
        - italic
        - underline
        - bts_paragraph
        - anchor
        - unorderedlist
        - alignleft
        - aligncenter
        - alignright
        - image
      remove_empty_nodes: false
      type: bard
      display: 'Text Content'
      container: assets
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            button_types:
              display: 'Button Types'
              icon: form-text-field
              fields:
                -
                  import: button_types
            layout_spacer:
              display: 'Layout Spacer'
              icon: align-object-center
              fields: {  }
            inline_image:
              display: 'Inline Image'
              icon: insert-image
              fields:
                -
                  handle: image
                  field:
                    max_files: 1
                    min_files: 1
                    container: assets
                    type: assets
                    display: Image
                    validate:
                      - required
                -
                  handle: width_percent
                  field:
                    type: range
                    display: Width
                    instructions: 'How wide the image appears relative to the text column.'
                    width: 50
                    min: 10
                    default: 75
                    append: '%'
                    validate:
                      - integer
                      - 'min:10'
                      - 'max:100'
                -
                  handle: align
                  field:
                    type: select
                    display: Alignment
                    width: 50
                    default: center
                    options:
                      -
                        key: left
                        value: Left
                      -
                        key: center
                        value: Middle
                      -
                        key: right
                        value: Right
                    validate:
                      - required
